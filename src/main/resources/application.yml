server:
  port: ${SMARTWASTE_PORT:8080}
smartwaste:
  vision:
    url: ${SMARTWASTE_VISION_URL:http://127.0.0.1:8082}
    internal-token: ${SMARTWASTE_VISION_INTERNAL_TOKEN:}
    max-bytes: ${SMARTWASTE_VISION_MAX_BYTES:5242880}
    read-timeout-millis: ${SMARTWASTE_VISION_READ_TIMEOUT_MILLIS:20000}
  rag:
    url: ${SMARTWASTE_RAG_URL:http://127.0.0.1:8081}
    internal-token: ${SMARTWASTE_RAG_INTERNAL_TOKEN:}
  auth:
    secret: ${SMARTWASTE_JWT_SECRET:}
    access-seconds: 900
    refresh-seconds: 604800
  amap:
    web-key: ${SMARTWASTE_AMAP_WEB_KEY:}
    js-key: ${SMARTWASTE_AMAP_JS_KEY:}
    security-js-code: ${SMARTWASTE_AMAP_SECURITY_JS_CODE:}
  orders:
    dispatch-millis: 2000
    consume-max-attempts: 5
  order-reminder:
    timeout-minutes: ${SMARTWASTE_ORDER_TIMEOUT_MINUTES:10}
    scan-interval-millis: ${SMARTWASTE_ORDER_SCAN_INTERVAL_MILLIS:60000}
    initial-delay-millis: ${SMARTWASTE_ORDER_SCAN_INITIAL_DELAY_MILLIS:5000}
spring:
  redis:
    host: ${SMARTWASTE_REDIS_HOST:127.0.0.1}
    port: ${SMARTWASTE_REDIS_PORT:6379}
    password: ${SMARTWASTE_REDIS_PASSWORD:}
    database: ${SMARTWASTE_REDIS_DATABASE:0}
    ssl: ${SMARTWASTE_REDIS_SSL:false}
    timeout: 3s
  rabbitmq:
    host: ${SMARTWASTE_RABBITMQ_HOST:127.0.0.1}
    port: ${SMARTWASTE_RABBITMQ_PORT:5672}
    username: ${SMARTWASTE_RABBITMQ_USERNAME:smartwaste}
    password: ${SMARTWASTE_RABBITMQ_PASSWORD:}
    virtual-host: ${SMARTWASTE_RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 2
        max-concurrency: 4
        default-requeue-rejected: false
        recovery-interval: 5000
  flyway:
    enabled: ${SMARTWASTE_SCHEMA_MIGRATION_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
  application:
    # 应用的名称
    name: SmartWaste
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${SMARTWASTE_DB_URL:jdbc:mysql://127.0.0.1:3306/smart_waste?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false}
      username: ${SMARTWASTE_DB_USERNAME:smartwaste}
      password: ${SMARTWASTE_DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 40MB
mybatis-plus:
  configuration:
    #在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
    # address_book ---> AddressBook
    map-underscore-to-camel-case: true

    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
