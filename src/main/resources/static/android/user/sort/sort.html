<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=0">
    <title>垃圾分类</title>
    <link rel="shortcut icon" href="../../../backend/favicon.ico">
    <script>
        (function () {
            var docEl = document.documentElement;

            function setRemUnit () {
                // 获取到rem的基准值
                var rem = docEl.clientWidth / 10;

                // 动态设置html根元素的fontSize
                docEl.style.fontSize = rem + 'px';
            }
            setRemUnit();

            // 窗口大小变化时 触发
            window.addEventListener('resize', setRemUnit);

            // 窗口出现在当前屏幕时
            window.addEventListener('pageshow', function (e) {
                if (e.persisted) {
                    setRemUnit();
                }
            });
        })();
    </script>
    <link rel="stylesheet" href="../lib/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="../common/bottomBar/bottomBar.css">
    <!--element-ui的样式-->
    <link rel="stylesheet" href="../../../backend/plugins/element-ui/index.css" />

</head>
<body>

    <!-- 头部开始 -->
    <header class="header" style="color: white">垃圾分类</header>
    <!-- 头部结束 -->

    <div id="sort" >

        <!-- 查询表单 -->
        <div  class="search-form">
            <el-form :inline="true" :model="formInline" size="small" class="form-inline">
                <el-form-item label="">
                    <el-input  v-model="formInline.name" style="width:90px" placeholder="物品名称"></el-input>
                </el-form-item>
                <el-form-item label="">
                    <el-select v-model="formInline.sortId" style="width: 108px" placeholder="垃圾类别">
                        <el-option label="所有垃圾" value=""></el-option>
                        <el-option label="可回收垃圾" value="1"></el-option>
                        <el-option label="有害垃圾" value="2"></el-option>
                        <el-option label="湿垃圾" value="3"></el-option>
                        <el-option label="干垃圾" value="4"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" icon="el-icon-search" circle @click="query"></el-button>
                </el-form-item>
            </el-form>
        </div>

        <!--垃圾分类表-->
        <el-table size="small"
                  current-row-key="id"
                  :data="tableData"
                  height=" calc(100vh - 7.25rem)"
                  highlight-current-row >
            <el-table-column label="序号" type="index" width="50" align="center">
            </el-table-column>
            <el-table-column prop="name" label="物品名" align="center">
            </el-table-column>

            <el-table-column prop="sort" label="所属垃圾类别" align="center">
            </el-table-column>
        </el-table>

        <!--分页工具条-->
        <el-pagination
                small
                @current-change="handleCurrentChange"
                :current-page.sync="currentPage"
                :page-size="20"
                :pager-count="5"
                layout="total, prev, pager, next"
                :total="totalCount"
                style="height: 1rem;">
        </el-pagination>

        <!--拍照上传按钮-->
        <div style="text-align: center;height: 1.33rem;">
            <!--<el-button type="primary" icon="el-icon-camera-solid" style="width: 70%;height: 80%" @click="classify" >拍照识别</el-button>-->
            <el-upload
                    ref="upload"
                    class="uploader"
                    action="/classification"
                    :http-request="uploadPhoto"
                    :on-success="classifySuccess"
                    :on-error="classifyFail"
                    :before-upload="beforeUpload"
                    accept="image/jpeg,image/png,image/webp"
                    :disabled="identifying"
                    :show-file-list="false"
                    name="file"
                    >
                <el-button type="primary" size="medium" icon="el-icon-camera-solid" :loading="identifying" :disabled="identifying" style="width: 200px;height: 1.1rem">{{ identifying ? '正在识别' : '拍照识别' }}</el-button>
            </el-upload>
        </div>

        <!--识别结果对话框-->
        <el-dialog :title="classifyForm.uncertain ? '识别结果待确认' : '识别结果'" class="classifyDialog" width="300px" :visible.sync="classifyDialogVisible" @closed="clearPreview">
            <el-form  :model="classifyForm">
                <el-form-item >
                    <el-image fit="contain" style="width: 100%;height: 160px" :src="classifyForm.imageUrl">
                    </el-image>
                </el-form-item>
                <el-form-item label="识别标签" label-width="70px">
                    <el-input :value="classifyForm.name" readonly></el-input>
                </el-form-item>
                <el-form-item label="参考分类" label-width="70px">
                    <el-input :value="classifyForm.sort" readonly></el-input>
                </el-form-item>
                <el-form-item label="置信度" label-width="70px">
                    <el-input :value="classifyForm.rate" readonly></el-input>
                </el-form-item>
            </el-form>
            <el-alert :title="classifyForm.message" :type="classifyForm.uncertain ? 'warning' : 'info'" :closable="false" show-icon></el-alert>
            <div v-if="classifyForm.uncertain && classifyForm.candidates.length" class="prediction-candidates"><p>候选结果供核对：</p><p v-for="(candidate, index) in classifyForm.candidates" :key="index">{{ candidate.name }} · {{ candidate.sort }} · {{ percent(candidate.confidence) }}</p></div>
            <p class="prediction-note">置信度是模型对本次预测的评分。建议每次拍摄一件垃圾，保持光线充足、主体清晰。</p>
            <div   class="dialog-footer">
                <el-button type="primary" @click="classifyDialogVisible = false">确 定</el-button>
            </div>
        </el-dialog>

    </div>


    <!-- 底部栏开始 -->
    <div class="bottom-bar"></div>
    <!-- 底部栏结束 -->

    <script src="../lib/jquery.min.js"></script>
    <script src="../common/bottomBar/bottomBar.js"></script>
    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="../../../backend/plugins/vue/vue.js"></script>
    <!-- 引入组件库 -->
    <script src="../../../backend/plugins/element-ui/index.js"></script>
    <!-- 引入axios -->
    <script src="../../../backend/plugins/axios/axios.min.js"></script>
    <script src="/workflow/auth.js"></script>
    <script src="/workflow/api.js"></script>

    <script src="sort.js"></script>

</body>
</html>
