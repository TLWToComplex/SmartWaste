<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清运上报处理</title>
<link rel="stylesheet" href="/backend/plugins/element-ui/index.css"><link rel="stylesheet" href="workflow.css"></head>
<body><main id="app" class="workspace" v-cloak><section class="panel"><div class="toolbar"><h1>清运上报处理</h1><el-button @click="load">刷新</el-button></div>
<p class="note">展示正在派发或处理失败的满桶上报。检查并恢复桶站配置及基础服务后，可对失败记录重新安排处理。</p>
<el-alert v-if="error" :title="error" type="error" :closable="false"></el-alert>
<el-table :data="events" v-loading="busy" empty-text="当前没有等待处理的上报"><el-table-column prop="id" label="上报编号" min-width="190"></el-table-column>
<el-table-column prop="binId" label="垃圾桶ID" min-width="190"></el-table-column><el-table-column label="来源" width="80"><template slot-scope="s">{{ s.row.source === 'USER' ? '用户' : '设备' }}</template></el-table-column>
<el-table-column label="进度" width="110"><template slot-scope="s">{{ stateLabel(s.row.state) }}</template></el-table-column><el-table-column prop="reportedAt" label="上报时间" min-width="170"></el-table-column>
<el-table-column prop="consumeAttempts" label="消费失败次数" width="120"></el-table-column><el-table-column prop="lastError" label="处理提示" min-width="220"></el-table-column>
<el-table-column label="操作" width="100"><template slot-scope="s"><el-button v-if="s.row.state === 'FAILED'" type="text" :loading="!!retrying[s.row.id]" @click="retry(s.row)">重新处理</el-button></template></el-table-column></el-table>
<el-pagination class="pagination" layout="prev,pager,next,total" :total="total" :page-size="10" :current-page="page" @current-change="changePage"></el-pagination>
</section></main><script src="/backend/plugins/vue/vue.js"></script><script src="/backend/plugins/element-ui/index.js"></script>
<script src="auth.js"></script><script src="api.js"></script><script src="events.js"></script></body></html>
