<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清运路线</title>
<link rel="stylesheet" href="/backend/plugins/element-ui/index.css"><link rel="stylesheet" href="workflow.css"></head>
<body><main id="app" class="workspace" v-cloak><section class="panel">
<div class="toolbar"><h1>垃圾桶至垃圾站清运路线</h1><el-button @click="load" :loading="busy">重新加载</el-button></div>
<el-alert v-if="error" :title="error" type="error" :closable="false"></el-alert>
<template v-if="route"><p>驾车距离 {{ (Number(route.distanceMeters) / 1000).toFixed(2) }} 公里，预计 {{ Math.ceil(Number(route.durationSeconds) / 60) }} 分钟</p>
<div class="actions"><a :href="navigation(route.origin, '垃圾桶')" target="_blank" rel="noopener">导航至垃圾桶</a><a :href="navigation(route.destination, '垃圾站')" target="_blank" rel="noopener">导航至垃圾站</a></div>
<p class="note">起点：{{ route.origin }}　终点：{{ route.destination }}　路线更新时间：{{ route.updatedAt }}</p></template>
<div id="route-map" class="transport-map"></div></section></main>
<script src="/backend/plugins/vue/vue.js"></script><script src="/backend/plugins/element-ui/index.js"></script>
<script src="auth.js"></script><script src="api.js"></script><script src="map.js"></script><script src="route.js"></script></body></html>
