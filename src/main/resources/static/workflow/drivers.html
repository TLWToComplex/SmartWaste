<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>司机管理</title>
<link rel="stylesheet" href="/backend/plugins/element-ui/index.css"><link rel="stylesheet" href="workflow.css"></head>
<body><main id="app" class="workspace" v-cloak><section class="panel"><div class="toolbar"><h1>司机管理</h1><div><el-button @click="load">刷新</el-button><el-button type="primary" @click="edit()">创建司机</el-button></div></div>
<el-alert v-if="error" :title="error" type="error" :closable="false"></el-alert>
<el-table :data="drivers" v-loading="busy"><el-table-column prop="username" label="账号"></el-table-column><el-table-column prop="name" label="姓名"></el-table-column>
<el-table-column prop="phone" label="电话"></el-table-column><el-table-column prop="carNumber" label="车牌号"></el-table-column>
<el-table-column label="状态"><template slot-scope="s">{{ s.row.status === 1 ? '启用' : '停用' }}</template></el-table-column>
<el-table-column label="操作"><template slot-scope="s"><el-button type="text" @click="edit(s.row)">编辑</el-button></template></el-table-column></el-table>
<el-pagination class="pagination" :current-page="page" :page-size="10" :total="Number(total)" layout="total, prev, pager, next" @current-change="changePage"></el-pagination></section>
<el-dialog :title="form.id ? '编辑司机' : '创建司机'" :visible.sync="editing" width="520px"><el-form label-position="top">
<el-form-item label="账号"><el-input v-model.trim="form.username" :disabled="!!form.id" maxlength="64"></el-input></el-form-item><el-form-item label="姓名"><el-input v-model.trim="form.name" maxlength="64"></el-input></el-form-item>
<el-form-item label="电话"><el-input v-model.trim="form.phone" maxlength="32"></el-input></el-form-item><el-form-item label="车牌号"><el-input v-model.trim="form.carNumber" maxlength="32"></el-input></el-form-item>
<el-form-item :label="form.id ? '重设密码（留空则保留）' : '密码（至少8位）'"><el-input v-model="form.password" type="password" show-password autocomplete="new-password"></el-input></el-form-item>
<el-form-item v-if="form.id" label="状态"><el-radio-group v-model="form.status"><el-radio :label="1">启用</el-radio><el-radio :label="0">停用</el-radio></el-radio-group></el-form-item></el-form>
<span slot="footer"><el-button @click="editing = false">取消</el-button><el-button type="primary" :loading="saving" @click="save">保存</el-button></span></el-dialog>
</main><script src="/backend/plugins/vue/vue.js"></script><script src="/backend/plugins/element-ui/index.js"></script><script src="/workflow/auth.js"></script><script src="api.js"></script><script src="drivers.js"></script></body></html>
